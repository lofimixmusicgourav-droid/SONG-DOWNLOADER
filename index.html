<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gourav Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-zinc-900 rounded-3xl p-8">
    <h1 class="text-4xl font-bold text-center mb-8">🎵 GOURAV DOWNLOADER</h1>

    <input id="url" type="text" placeholder="YouTube ya JioSaavn link paste karo" 
           class="w-full bg-zinc-800 p-5 rounded-2xl mb-6">

    <div class="grid grid-cols-2 gap-4">
      <button onclick="youtubeDownload()" class="bg-purple-600 py-6 rounded-2xl font-bold">
        YouTube Song/Playlist
      </button>
      <button onclick="jiosaavnHelp()" class="bg-pink-600 py-6 rounded-2xl font-bold">
        JioSaavn Song
      </button>
    </div>

    <p id="status" class="mt-8 text-center text-sm"></p>
  </div>

  <script>
    function youtubeDownload() {
      let url = document.getElementById('url').value;
      document.getElementById('status').innerHTML = "✅ YouTube ke liye: <a href='https://media.ytmp3.gg/?url=" + encodeURIComponent(url) + "' target='_blank' class='text-purple-400 underline'>Yahan click karo</a>";
    }

    function jiosaavnHelp() {
      document.getElementById('status').innerHTML = `
        JioSaavn ke liye direct download nahi hota.<br><br>
        ✅ Best tareeka:<br>
        1. JioSaavn Pro le lo (sabse safe)<br>
        2. Ya Chrome Extension use karo: "JioSaavn Song Downloader"
      `;
    }
  </script>
</body>
</html>
